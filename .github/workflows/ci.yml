name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Build and smoke test (Arch Linux)
    runs-on: ubuntu-latest
    container: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git meson ninja gcc pkgconf \
            wayland-protocols wlroots0.20 libinput libxkbcommon pixman glib2 \
            libxml2 pango cairo librsvg libsfdo xcb-util-wm wayland \
            xorg-xwayland xterm foot grim waybar fcitx5 python python-cairo python-gobject gtk4 \
            python-pyflakes \
            ttf-dejavu

      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build
        run: |
          meson setup build
          ninja -C build

      # the Python code's names (owbox Settings' callbacks have no tests)
      - name: Python check
        run: pyflakes settings/owbox_settings settings/owbox-settings tests tools

      - name: Smoke test
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          # a session bus, which waybar needs (for its tray)
          dbus-uuidgen --ensure=/etc/machine-id
          dbus-run-session -- tests/smoke.py --keep

      - name: Settings test
        run: |
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          tests/settings_test.py

      # memory errors and undefined behavior; shift-base is left out
      # because Openbox's pixel code shifts into the sign bit, which GCC
      # and clang define
      - name: Smoke test with AddressSanitizer and UBSan
        run: |
          meson setup build-asan -Db_sanitize=address,undefined \
            -Db_lundef=false -Dc_args=-fno-sanitize=shift-base
          ninja -C build-asan
          export XDG_RUNTIME_DIR=$(mktemp -d)
          chmod 700 "$XDG_RUNTIME_DIR"
          OWBOX_BUILD=build-asan dbus-run-session -- tests/smoke.py --keep
