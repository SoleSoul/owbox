# fuzzel for owbox: the launcher Super shows, in the panels' dark glass.
# Copy it to ~/.config/fuzzel/fuzzel.ini.

[main]
font=Noto Sans:size=12,Font Awesome 7 Free:style=Solid:size=11
prompt="  "
placeholder=Search applications
terminal=owbox-terminal -e
width=36
lines=9
horizontal-pad=20
vertical-pad=16
inner-pad=10
line-height=30
layer=overlay
# leave out the applications meant only for other desktops (OnlyShowIn=XFCE)
filter-desktop=yes

[colors]
background=121218eb
text=e6e6eacc
prompt=8ab4f8ff
placeholder=e6e6ea66
input=ffffffff
match=8ab4f8ff
selection=ffffff1f
selection-text=ffffffff
selection-match=8ab4f8ff
counter=e6e6ea66
border=ffffff1a

[border]
width=1
radius=14
