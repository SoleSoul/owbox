# Which xdg-desktop-portal backends serve owbox sessions
# (XDG_CURRENT_DESKTOP=owbox).  Screenshots and screen sharing need
# xdg-desktop-portal-wlr, file choosers and the rest come from the GTK one.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
org.freedesktop.impl.portal.Inhibit=none
